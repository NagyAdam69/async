<script>
    autok = ["Audi", "BMW", "Mercedes-Benz", "Toyota"];
    const azonositokLekerese = new Promise(
        (resolve, reject) => {
            setTimeout(() =>{
                resolve([0, 1, 2, 3])
                reject("Hiba történt!")
            }, 3000)
        }
    );

    const autoLekeres = autoID => {
        return new Promise(
            (resolve, reject) => {
                setTimeout(id => {
                    resolve(autok[id])
                    reject("Fekália!")
                }, 2000, autoID)
            }
        )
    };

    azonositokLekerese
    .then(azonositok => {
        console.log(azonositok)
    })
    .then(auto => {
        console.log(auto)
    })
    .catch(hiba => {
        console.log(hiba)
    });
</script>
